apiVersion: apps/v1
kind: Deployment
metadata:
  name: webpage-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webpage-blue
  template:
    metadata:
      labels:
        app: webpage-blue
    spec:
      containers:
      - name: webpage-blue
        image: danferreira011/web-color:blue
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: webpage-blue
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  selector:
    app: webpage
  ports:
  - port: 80
    targetPort: 80     
  type: LoadBalancer
