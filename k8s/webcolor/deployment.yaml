apiVersion: apps/v1
kind: Deployment
metadata:
  name: webpage
spec:
  replicas: 6
  selector:
    matchLabels:
      app: webpage
  template:
    metadata:
      labels:
        app: webpage
    spec:
      containers:
      - name: webpage
        image: danferreira011/web-color:blue
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: webpage
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  selector:
    app: webpage
  ports:
  - port: 80
    targetPort: 80     
  type: LoadBalancer
