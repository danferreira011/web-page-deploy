apiVersion: batch/v1
kind: Job
matedata:
  generateName: pre-sync-
  annotations:
    argocd.argoproj.io/hook: PreSync
spec:
  template:
    spec:
      containers:
        - name: chamada
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              curl -X POST -H "Content-Type: application/json" \
              -d '{"message": "Entrou em PreSync !!!"}' \
              https://webhook.site/d592211e-30ba-47c5-9d31-9a41421d7b72
      restartPolicy: Never
---
